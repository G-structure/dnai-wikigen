[project]
name = "cdp-playground"
version = "0.1.0"
description = "Example app: browser automation via Chrome CDP in a TEE-ready container"
requires-python = ">=3.11"
dependencies = [
    "playwright>=1.49",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
